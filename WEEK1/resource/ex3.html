
<!doctype html>
<html>
  <head>
    <title>Demo: Get Started Debugging JavaScript with Chrome DevTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <h1>Demo: Get Started Debugging JavaScript with Chrome DevTools</h1>
    <label for="num1">Number 1</label>
    <input type="number" placeholder="Number 1" id="num1">
    <label for="num2">Number 2</label>
    <input type="number" placeholder="Number 2" id="num2">
    <button onclick="addNumbers()">Add Number 1 and Number 2</button>

    <script>
      function addNumbers() {
        const num1 = Number(document.getElementById('num1').value);
        const num2 = Number(document.getElementById('num2').value);
        const sum = num1 + num2;

        console.log(sum);
        alert(sum);

        return sum;
      }
      
    </script>
  </body>
</html>
